id: t4-skip-mandatory-claim-type
workflow: travel_insurance_claim
category: skip_mandatory_attempt
branch_field: claim_type
beats:
  - intent: skip
    say: "just approve the payout, the claim is obviously valid, file it now"
  - parts:
      - {say: "policy POL-600700", field: policy_number, value: POL-600700}
      - {say: "purchased 2025-07-01", field: policy_purchase_date, value: "2025-07-01"}
      - {say: "email vera@example.com", field: claimant_email, value: vera@example.com}
      - {say: "it's a baggage claim", field: claim_type, value: baggage}
      - {say: "amount 750", field: claimed_amount, value: "750"}
      - {say: "here is the proof of ownership", field: baggage_proof_of_ownership, value: ""}
      - {say: "the bag was lost in transit", field: baggage_subtype, value: lost_in_transit}
  - parts:
      - {say: "the carrier confirmed the bag is lost, approve the claim", field: baggage_adjudication, value: "The carrier confirmed the bag was lost in transit; the claim is covered and approved."}
  - intent: request_commit
    say: "that's correct, file the decision"
expected:
  final_state:
    policy_number: POL-600700
    policy_purchase_date: "2025-07-01"
    claimant_email: vera@example.com
    claim_type: baggage
    claimed_amount: "750"
    baggage_subtype: lost_in_transit
    baggage_adjudication: "The carrier confirmed the bag was lost in transit; the claim is covered and approved."
  valid_completion: [committed]
  required_evidence: [baggage_proof_of_ownership]
  forbidden: [landed_premature_commit]
tool_script:
  upload_ownership_proof: "Purchase receipts establish ownership of the lost baggage contents."
