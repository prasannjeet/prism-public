id: w3-out-of-order-connectivity
workflow: support_diagnosis
category: out_of_order
branch_field: category
beats:
  - parts:
      - {say: "it's a connectivity problem", field: category, value: connectivity}
      - {say: "the outage started on the 8th of January", field: outage_started, value: "2026-01-08"}
      - {say: "my internet has been completely dead since then", field: issue_summary, value: "My internet has been completely dead for several days"}
      - {say: "account is ACC-445566", field: account_id, value: ACC-445566}
      - {say: "email priya@example.com", field: customer_email, value: priya@example.com}
      - {say: "I'm on the pro plan", field: plan_tier, value: pro}
  - parts:
      - {say: "check the service status", field: service_status, value: ""}
      - {say: "and run a line test", field: line_test, value: ""}
  - parts:
      - {say: "the cause is a confirmed regional outage, that's the resolution", field: connectivity_resolution, value: "A confirmed regional outage since Jan 8 explains the dead line; service is being restored by network ops."}
  - intent: request_commit
    say: "file the ticket"
expected:
  final_state:
    account_id: ACC-445566
    customer_email: priya@example.com
    plan_tier: pro
    issue_summary: "My internet has been completely dead for several days"
    category: connectivity
    outage_started: "2026-01-08"
    connectivity_resolution: "A confirmed regional outage since Jan 8 explains the dead line; service is being restored by network ops."
  valid_completion: [committed]
  required_evidence: [service_status, line_test]
  forbidden: []
tool_script:
  check_service_status: "Regional outage declared for the subscriber's area starting Jan 8, ongoing."
  run_line_test: "Line test cannot complete: no carrier detected on the loop, consistent with the outage."
