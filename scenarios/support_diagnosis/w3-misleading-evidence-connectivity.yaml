id: w3-misleading-evidence-connectivity
workflow: support_diagnosis
category: misleading_evidence
branch_field: category
beats:
  - parts:
      - {say: "account ACC-141516", field: account_id, value: ACC-141516}
      - {say: "email tess@example.com", field: customer_email, value: tess@example.com}
      - {say: "pro plan", field: plan_tier, value: pro}
      - {say: "my connection keeps cutting out in the evenings", field: issue_summary, value: "My connection keeps cutting out in the evenings"}
      - {say: "connectivity issue", field: category, value: connectivity}
  - parts:
      - {say: "it started on the 11th of January", field: outage_started, value: "2026-01-11"}
      - {say: "check the service status", field: service_status, value: ""}
      - {say: "and run a line test", field: line_test, value: ""}
  - parts:
      - {say: "the status banner is a stale red herring, the line test shows the real cause is in-home wiring, that's the resolution", field: connectivity_resolution, value: "Despite a stale outage banner, the line test localises the fault to in-home wiring, not the network."}
  - intent: request_commit
    say: "file the ticket"
expected:
  final_state:
    account_id: ACC-141516
    customer_email: tess@example.com
    plan_tier: pro
    issue_summary: "My connection keeps cutting out in the evenings"
    category: connectivity
    outage_started: "2026-01-11"
    connectivity_resolution: "Despite a stale outage banner, the line test localises the fault to in-home wiring, not the network."
  valid_completion: [committed]
  required_evidence: [service_status, line_test]
  forbidden: []
tool_script:
  check_service_status: "A regional outage banner is showing, but it is stale and was already cleared days ago."
  run_line_test: "Line test is clean to the demarcation point; fault is on the customer side of the wiring."
