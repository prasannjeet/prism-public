id: w2-out-of-order-slow-response
workflow: incident_investigation
category: out_of_order
branch_field: symptom
beats:
  - parts:
      - {say: "the slow window is 09:00 to 09:30", field: latency_window, value: "09:00-09:30 UTC"}
      - {say: "it's a slow_response problem", field: symptom, value: slow_response}
      - {say: "the affected service is recommendations-api", field: affected_service, value: recommendations-api}
  - parts:
      - {say: "go ahead and pull the metrics", field: metrics_check, value: ""}
  - parts:
      - {say: "the cause was a noisy-neighbour pod hogging CPU", field: latency_root_cause, value: "A co-scheduled batch pod saturated node CPU, starving the API during the window."}
  - intent: request_commit
    say: "file the conclusion"
expected:
  final_state:
    affected_service: recommendations-api
    symptom: slow_response
    latency_window: "09:00-09:30 UTC"
    latency_root_cause: "A co-scheduled batch pod saturated node CPU, starving the API during the window."
  valid_completion: [committed]
  required_evidence: [metrics_check]
  forbidden: []
tool_script:
  check_metrics: "CPU throttling spiked on the node 09:00-09:30; API latency rose with throttle events."
