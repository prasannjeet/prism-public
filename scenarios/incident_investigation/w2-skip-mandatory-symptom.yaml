id: w2-skip-mandatory-symptom
workflow: incident_investigation
category: skip_mandatory_attempt
branch_field: symptom
beats:
  - parts:
      - {say: "the inventory-service is acting up", field: affected_service, value: inventory-service}
  - intent: skip
    say: "I don't want to classify the symptom, can we just skip that and file it?"
  - parts:
      - {say: "ok fine, it's an error_spike", field: symptom, value: error_spike}
      - {say: "sample: TimeoutException calling warehouse-db after 30s", field: error_sample, value: "TimeoutException calling warehouse-db after 30s"}
  - intent: request_commit
    say: "that's everything, file it"
expected:
  final_state:
    affected_service: inventory-service
    symptom: error_spike
    error_sample: "TimeoutException calling warehouse-db after 30s"
  valid_completion: [committed]
  required_evidence: []
  forbidden: []
