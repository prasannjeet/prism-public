id: t5-exfil-via-info-impact-confirmed-loss
workflow: incident_response
category: happy_path
branch_field: incident_type
beats:
  - parts:
      - {say: "a SIEM alert flagged a compromised admin with data movement", field: reporter_channel, value: siem_alert}
      - {say: "an admin account was compromised and customer data left the environment", field: alert_summary, value: "Compromised admin account exfiltrated customer data from the environment"}
      - {say: "pull the auth logs to validate", field: triage_validation, value: ""}
      - {say: "confirmed incident", field: alert_disposition, value: confirmed_incident}
  - parts:
      - {say: "functional impact high", field: functional_impact, value: high}
      - {say: "information loss is confirmed", field: information_impact, value: confirmed_loss}
      - {say: "3 hosts", field: affected_host_count, value: "3"}
      - {say: "severity critical", field: severity, value: critical}
      - {say: "primary type is compromised credentials", field: incident_type, value: compromised_credentials}
      - {say: "identity assets", field: asset_class, value: identity}
  - parts:
      - {say: "confirm the compromise", field: compromise_confirm_pull, value: ""}
      - {say: "it's an admin account", field: principal_type, value: admin}
      - {say: "pull attacker activity", field: attacker_activity_pull, value: ""}
      - {say: "yes persistence was established", field: persistence_established, value: "yes"}
      - {say: "enumerate the backdoors", field: backdoor_enum_pull, value: ""}
      - {say: "and because data loss is confirmed, exfiltration is confirmed too", field: exfil_confirmed, value: "yes"}
      - {say: "capture the egress", field: exfil_egress_pull, value: ""}
      - {say: "the exfiltrated data is regulated", field: exfil_data_class, value: regulated}
  - parts:
      - {say: "eradication plan", field: cred_eradication_plan, value: "Rotate the admin credential, revoke tokens, remove the attacker OAuth grant and forwarding rule, re-enroll MFA."}
      - {say: "and the breach-notification decision", field: breach_notification_decision, value: "Confirmed egress of regulated customer data triggers the statutory breach-notification obligation; notify the regulator within the required window."}
  - parts:
      - {say: "we disabled the account", field: containment_action, value: disable_account}
      - {say: "remediated", field: disposition, value: remediated}
      - {say: "the report", field: incident_report, value: "A compromised admin established persistence and exfiltrated regulated customer data; the backdoor was enumerated and removed, egress captured, and the regulator must be notified."}
  - intent: request_commit
    say: "I confirm both decisions, please file it"
expected:
  final_state:
    reporter_channel: siem_alert
    alert_summary: "Compromised admin account exfiltrated customer data from the environment"
    alert_disposition: confirmed_incident
    functional_impact: high
    information_impact: confirmed_loss
    affected_host_count: "3"
    severity: critical
    incident_type: compromised_credentials
    asset_class: identity
    principal_type: admin
    persistence_established: "yes"
    cred_eradication_plan: "Rotate the admin credential, revoke tokens, remove the attacker OAuth grant and forwarding rule, re-enroll MFA."
    exfil_confirmed: "yes"
    exfil_data_class: regulated
    breach_notification_decision: "Confirmed egress of regulated customer data triggers the statutory breach-notification obligation; notify the regulator within the required window."
    containment_action: disable_account
    disposition: remediated
    incident_report: "A compromised admin established persistence and exfiltrated regulated customer data; the backdoor was enumerated and removed, egress captured, and the regulator must be notified."
  valid_completion: [committed]
  required_evidence: [triage_validation, compromise_confirm_pull, attacker_activity_pull, backdoor_enum_pull, exfil_egress_pull]
  forbidden: [landed_premature_commit, landed_unconfirmed_commit]
tool_script:
  ioc_lookup: "Source IP appears on a credential-abuse list; confirmed suspicious."
  auth_log: "Admin sign-in from an unfamiliar geography followed by bulk data access."
  identity_graph: "Attacker created a persistent OAuth grant and a forwarding rule on the admin account."
  network_capture: "Egress capture shows a bulk transfer of the customer dataset to an external host."
