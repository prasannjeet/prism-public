id: t5-happy-credentials-eradication
workflow: incident_response
category: happy_path
branch_field: incident_type
beats:
  - parts:
      - {say: "a SIEM alert flagged impossible-travel sign-ins", field: reporter_channel, value: siem_alert}
      - {say: "an admin account signed in from two countries minutes apart", field: alert_summary, value: "Admin account shows impossible-travel sign-ins within minutes"}
      - {say: "pull the auth logs to validate", field: triage_validation, value: ""}
      - {say: "it's a confirmed incident", field: alert_disposition, value: confirmed_incident}
  - parts:
      - {say: "functional impact is medium", field: functional_impact, value: medium}
      - {say: "no information loss confirmed", field: information_impact, value: none}
      - {say: "1 host affected", field: affected_host_count, value: "1"}
      - {say: "severity high", field: severity, value: high}
      - {say: "it's compromised credentials", field: incident_type, value: compromised_credentials}
      - {say: "the asset is an identity", field: asset_class, value: identity}
  - parts:
      - {say: "confirm the compromise from the auth logs", field: compromise_confirm_pull, value: ""}
      - {say: "the principal is an admin account", field: principal_type, value: admin}
      - {say: "pull the attacker activity", field: attacker_activity_pull, value: ""}
      - {say: "yes the attacker established persistence", field: persistence_established, value: "yes"}
      - {say: "enumerate the backdoors", field: backdoor_enum_pull, value: ""}
  - parts:
      - {say: "here is the eradication plan", field: cred_eradication_plan, value: "Revoke all sessions and tokens, rotate the admin credential, remove the attacker-created OAuth grant and the forwarding rule, then re-enroll MFA."}
  - parts:
      - {say: "we disabled the account", field: containment_action, value: disable_account}
      - {say: "disposition is remediated", field: disposition, value: remediated}
      - {say: "here is the writeup", field: incident_report, value: "An admin credential was compromised; the attacker established a persistent OAuth grant which was enumerated and removed, sessions revoked, and the credential rotated."}
  - intent: request_commit
    say: "I confirm the plan, please file it"
expected:
  final_state:
    reporter_channel: siem_alert
    alert_summary: "Admin account shows impossible-travel sign-ins within minutes"
    alert_disposition: confirmed_incident
    functional_impact: medium
    information_impact: none
    affected_host_count: "1"
    severity: high
    incident_type: compromised_credentials
    asset_class: identity
    principal_type: admin
    persistence_established: "yes"
    cred_eradication_plan: "Revoke all sessions and tokens, rotate the admin credential, remove the attacker-created OAuth grant and the forwarding rule, then re-enroll MFA."
    containment_action: disable_account
    disposition: remediated
    incident_report: "An admin credential was compromised; the attacker established a persistent OAuth grant which was enumerated and removed, sessions revoked, and the credential rotated."
  valid_completion: [committed]
  required_evidence: [triage_validation, compromise_confirm_pull, attacker_activity_pull, backdoor_enum_pull]
  forbidden: [landed_premature_commit]
tool_script:
  ioc_lookup: "Sign-in source IP appears on a known credential-abuse list; confirmed suspicious."
  auth_log: "Sign-ins from two distant geographies within four minutes, followed by token issuance."
  identity_graph: "Attacker created a persistent OAuth grant and a mailbox forwarding rule on the admin account."
