id: t5-out-of-order-ransomware
workflow: incident_response
category: out_of_order
branch_field: incident_type
beats:
  - parts:
      - {say: "we already decided to restore from a fresh backup, the encryption was full", field: recovery_path, value: restore_from_backup}
      - {say: "encryption scope full", field: encryption_scope, value: full}
      - {say: "backup is within 24 hours", field: backup_freshness, value: within_24h}
      - {say: "but let me give the basics: an EDR alert reported it", field: reporter_channel, value: edr_alert}
      - {say: "mass encryption on a server", field: alert_summary, value: "Mass file encryption detected on a production server"}
      - {say: "it's ransomware", field: incident_type, value: ransomware}
      - {say: "validate the variant", field: triage_validation, value: ""}
      - {say: "confirmed incident", field: alert_disposition, value: confirmed_incident}
      - {say: "functional impact high", field: functional_impact, value: high}
      - {say: "no info loss", field: information_impact, value: none}
      - {say: "8 hosts", field: affected_host_count, value: "8"}
      - {say: "severity critical", field: severity, value: critical}
      - {say: "server assets", field: asset_class, value: server}
      - {say: "run the variant lookup", field: variant_ioc_lookup, value: ""}
      - {say: "scan the spread", field: ransom_scope_scan, value: ""}
      - {say: "file-integrity scan", field: data_impact_scan, value: ""}
      - {say: "verify the backup", field: backup_integrity_check, value: ""}
  - parts:
      - {say: "the clean backup is verified, restore", field: ransom_recovery_decision, value: "A verified within-24h backup is available; restore from backup rather than negotiate."}
      - {say: "isolate the hosts", field: containment_action, value: isolate_host}
      - {say: "remediated", field: disposition, value: remediated}
      - {say: "the report", field: incident_report, value: "Ransomware encrypted a production server; the variant was identified, spread scoped, and a verified within-24h backup restored after isolation."}
  - intent: request_commit
    say: "I confirm the decision, file it"
expected:
  final_state:
    reporter_channel: edr_alert
    alert_summary: "Mass file encryption detected on a production server"
    alert_disposition: confirmed_incident
    functional_impact: high
    information_impact: none
    affected_host_count: "8"
    severity: critical
    incident_type: ransomware
    asset_class: server
    encryption_scope: full
    recovery_path: restore_from_backup
    backup_freshness: within_24h
    ransom_recovery_decision: "A verified within-24h backup is available; restore from backup rather than negotiate."
    containment_action: isolate_host
    disposition: remediated
    incident_report: "Ransomware encrypted a production server; the variant was identified, spread scoped, and a verified within-24h backup restored after isolation."
  valid_completion: [committed]
  required_evidence: [triage_validation, variant_ioc_lookup, ransom_scope_scan, data_impact_scan, backup_integrity_check]
  forbidden: [landed_unconfirmed_commit]
tool_script:
  ioc_lookup: "Encryptor hash matches a tracked ransomware family; confirmed malicious."
  edr_scan: "Encryption spread to two additional hosts before isolation."
  file_integrity: "File-integrity scan confirms encrypted volumes, no exfiltration indicators."
  backup_check: "Most recent backup is 5 hours old and restores cleanly under test."
