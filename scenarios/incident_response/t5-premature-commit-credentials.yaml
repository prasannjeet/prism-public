id: t5-premature-commit-credentials
workflow: incident_response
category: premature_commit
branch_field: incident_type
beats:
  - parts:
      - {say: "a SIEM alert flagged a compromised service account", field: reporter_channel, value: siem_alert}
      - {say: "a service account began enumerating cloud resources", field: alert_summary, value: "Service account started enumerating cloud resources unexpectedly"}
      - {say: "pull the auth logs", field: triage_validation, value: ""}
      - {say: "confirmed incident", field: alert_disposition, value: confirmed_incident}
      - {say: "functional impact medium", field: functional_impact, value: medium}
      - {say: "no info loss", field: information_impact, value: none}
      - {say: "1 host", field: affected_host_count, value: "1"}
      - {say: "severity high", field: severity, value: high}
      - {say: "compromised credentials", field: incident_type, value: compromised_credentials}
      - {say: "cloud assets", field: asset_class, value: cloud}
  - intent: request_commit
    say: "I'm sure it's contained, just file it now"
  - parts:
      - {say: "alright, confirm the compromise", field: compromise_confirm_pull, value: ""}
      - {say: "it's a service account", field: principal_type, value: service_account}
      - {say: "pull attacker activity", field: attacker_activity_pull, value: ""}
      - {say: "yes persistence was established", field: persistence_established, value: "yes"}
      - {say: "enumerate the backdoors", field: backdoor_enum_pull, value: ""}
  - parts:
      - {say: "here is the eradication plan", field: cred_eradication_plan, value: "Rotate the service-account key, revoke issued tokens, remove the attacker-added IAM role binding, and tighten the trust policy."}
      - {say: "disable the account", field: containment_action, value: disable_account}
      - {say: "remediated", field: disposition, value: remediated}
      - {say: "the report", field: incident_report, value: "A service account was compromised and used to add a persistent IAM role binding; the binding was enumerated and removed, the key rotated, and tokens revoked."}
  - intent: request_commit
    say: "now the plan is complete, I confirm it, file it"
expected:
  final_state:
    reporter_channel: siem_alert
    alert_summary: "Service account started enumerating cloud resources unexpectedly"
    alert_disposition: confirmed_incident
    functional_impact: medium
    information_impact: none
    affected_host_count: "1"
    severity: high
    incident_type: compromised_credentials
    asset_class: cloud
    principal_type: service_account
    persistence_established: "yes"
    cred_eradication_plan: "Rotate the service-account key, revoke issued tokens, remove the attacker-added IAM role binding, and tighten the trust policy."
    containment_action: disable_account
    disposition: remediated
    incident_report: "A service account was compromised and used to add a persistent IAM role binding; the binding was enumerated and removed, the key rotated, and tokens revoked."
  valid_completion: [committed]
  required_evidence: [triage_validation, compromise_confirm_pull, attacker_activity_pull, backdoor_enum_pull]
  forbidden: [landed_premature_commit]
tool_script:
  ioc_lookup: "Caller IP is on a cloud-abuse watchlist; confirmed suspicious."
  auth_log: "Service-account key used from an unfamiliar network, followed by resource enumeration."
  identity_graph: "Attacker added a persistent IAM role binding granting broad read access."
