[project]
name = "prism"
version = "0.1.0"
description = "PRISM: global process awareness + local decision autonomy + deterministic consequence boundaries for LLM workflow agents. Research prototype + benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prism*", "bench*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["prism", "bench"]

# Analysis deps ship no type stubs; the aggregation/plot layer is the only
# consumer and is smoke-tested. Don't let missing third-party stubs fail the gate.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

# numpy is pulled in transitively by pandas/matplotlib; recent numpy stubs use
# 3.12+ `type` statements that mypy cannot parse under python_version = 3.11.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits a real model API; excluded from the default run"]
addopts = "-m 'not live'"
